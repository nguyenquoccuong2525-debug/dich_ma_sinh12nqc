<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Tương Tác Cao Cấp: Quá Trình Dịch Mã - Sinh Học 12</title>
    <style>
        :root {
            --bg-color: #0a0f24;
            --panel-bg: rgba(16, 24, 48, 0.75);
            --border-glow: rgba(0, 230, 118, 0.3);
            --text-main: #e3e9f5;
            --accent-green: #00e676;
            --accent-blue: #00b0ff;
            --accent-amber: #ffd700;
            --accent-red: #ff3d00;
            --font-stack: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-stack);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #142046 0%, #0a0f24 100%);
        }

        /* Ambient particles simulation via CSS background animation */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .screen {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .screen.active { display: flex; flex-direction: column; }

        /* Splash Screen */
        #splash-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .glow-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 176, 255, 0.6);
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-bottom: 40px;
            font-weight: 300;
        }

        .big-btn {
            background: linear-gradient(135deg, #00b0ff 0%, #00e676 100%);
            border: none;
            color: #000;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.4);
            transition: all 0.3s ease;
        }

        .big-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(0, 230, 118, 0.8);
        }

        /* Main Lab Workspace */
        header {
            padding: 15px 30px;
            background: rgba(10, 15, 36, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lab-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: calc(100vh - 70px);
            padding: 15px;
            gap: 15px;
        }

        @media (max-width: 1024px) {
            .lab-container { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
        }

        .main-simulation-block {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .canvas-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            min-height: 450px;
        }

        /* SVG Vector Engine Graphing style */
        #sim-svg {
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease-out;
        }

        .zoom-controls {
            position: absolute;
            top: 15px; left: 15px;
            display: flex; gap: 8px;
            z-index: 10;
        }

        .utility-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .utility-btn:hover { background: rgba(255,255,255,0.25); }

        /* Animation Controllers */
        .controls-bar {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            backdrop-filter: blur(12px);
        }

        .btn-group { display: flex; gap: 8px; }
        
        .control-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
        }

        .control-btn:hover:not(:disabled) {
            background: var(--accent-blue);
            color: #000;
            border-color: transparent;
        }

        .control-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Progress Steps Timeline */
        .timeline {
            display: flex; flex: 1; margin: 0 20px;
            position: relative; align-items: center;
        }
        .timeline-line {
position: absolute; left: 0; right: 0; height: 4px;
            background: rgba(255,255,255,0.1); z-index: 1;
        }
        .timeline-progress {
            position: absolute; left: 0; width: 0%; height: 4px;
            background: var(--accent-green); z-index: 2; transition: width 0.3s;
        }
        .timeline-nodes {
            display: flex; justify-content: space-between; width: 100%; z-index: 3;
        }
        .timeline-node {
            width: 14px; height: 14px; border-radius: 50%; background: #2a355a;
            border: 2px solid #142046; cursor: pointer; transition: all 0.3s;
            position: relative;
        }
        .timeline-node.active {
            background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green);
        }
        .timeline-node::after {
            content: attr(data-label); position: absolute; top: 18px; left: 50%;
            transform: translateX(-50%); font-size: 0.7rem; white-space: nowrap; color: #8ba2c4;
        }

        /* Sidebar Panels Layout */
        .sidebar {
            display: flex; flex-direction: column; gap: 15px; height: 100%; overflow-y: auto;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 15px;
            backdrop-filter: blur(12px);
        }

        .panel h3 {
            font-size: 1rem; margin-bottom: 12px; color: var(--accent-blue);
            display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .explanation-text { font-size: 0.9rem; line-height: 1.45; min-height: 50px; }
        
        .simpler-box {
            margin-top: 10px; background: rgba(0, 176, 255, 0.1);
            border-left: 3px solid var(--accent-blue); padding: 8px;
            border-radius: 0 6px 6px 0; font-size: 0.85rem; display: none;
        }

        /* Live HUD Info Bar */
        .hud-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .hud-item { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .hud-label { font-size: 0.7rem; color: #8ba2c4; text-transform: uppercase; }
        .hud-value { font-size: 0.9rem; font-weight: bold; margin-top: 2px; }

        /* Dict / Interactive components */
        .codon-lookup-box input {
            width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; border-radius: 6px; text-transform: uppercase; text-align: center; font-weight: bold;
            font-size: 1.1rem; letter-spacing: 2px;
        }
        .codon-lookup-box input:focus { border-color: var(--accent-green); outline: none; }
        .lookup-result {
            margin-top: 10px; text-align: center; min-height: 40px; font-weight: 600;
padding: 6px; border-radius: 4px;
        }

        /* Mini game and quiz */
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .opt-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left;
            transition: all 0.2s; font-size: 0.85rem;
        }
        .opt-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--accent-blue); }
        
        .game-feedback { margin-top: 8px; font-size: 0.85rem; font-weight: 500; min-height: 20px; }

        /* Quiz Overlay & End Screens */
        .quiz-container { display: flex; flex-direction: column; gap: 12px; }
        .quiz-score-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .quiz-score-fill { height: 100%; width: 0%; background: var(--accent-amber); transition: width 0.3s; }
